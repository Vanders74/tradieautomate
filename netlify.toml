  status = 301
  force = true

[[redirects]]
  from = "/blog/sell-your-solar-business-servicem8"
  to = "/blog/sell-servicem8-trade-business-value/"
  status = 301
  force = true

# Fix trailing-slash cannibalisation: consolidate ranking power into canonical (trailing slash) URL
# GSC was surfacing both versions separately, splitting ~2,800 impressions at position ~26
# REMOVED Sep 2026: the manual /slug -> /slug/ rule created a SELF-REDIRECT LOOP — Netlify
# applied it to the slashed URL too, 301ing the canonical page to itself (GSC "redirect issue").
# Astro trailingSlash:'always' generates the slashed canonical; Netlify auto-301s no-slash -> slash.
# (Verified: ccew-nsw + servicem8-review redirect correctly with no manual rule.)

