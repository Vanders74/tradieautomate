[build]
  command = "npm install && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# 301 redirects for duplicate content consolidation
# Old "sell solar business" -> canonical "sell trade business value"
[[redirects]]
  from = "/blog/sell-your-solar-business-servicem8/"
  to = "/blog/sell-servicem8-trade-business-value/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/sell-your-solar-business-servicem8"
  to = "/blog/sell-servicem8-trade-business-value/"
  status = 301
  force = true

# Fix trailing-slash cannibalisation: consolidate ranking power into canonical (trailing slash) URL
# GSC was surfacing both versions separately, splitting ~2,800 impressions at position ~26
[[redirects]]
  from = "/blog/best-job-management-software-electricians-australia"
  to = "/blog/best-job-management-software-electricians-australia/"
  status = 301
  force = true

# Consolidate stale duplicate guide into canonical blog article (solar job mgmt cannibalisation)
[[redirects]]
  from = "/guides/best-job-management-software-solar-installers-australia-2026"
  to = "/blog/solar-job-management-software-australia-2026/"
  status = 301
  force = true

[[redirects]]
  from = "/guides/best-job-management-software-solar-installers-australia-2026/"
  to = "/blog/solar-job-management-software-australia-2026/"
  status = 301
  force = true

# Consolidate duplicate heat-pump hot water articles (Jun 9 2026, same-day near-duplicates)
# "Installation Guide" -> canonical "for Electricians: Circuits, Rebates & Sales"
[[redirects]]
  from = "/blog/heat-pump-hot-water-installation-guide-electricians-2026"
  to = "/blog/heat-pump-hot-water-installation-electricians-australia/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/heat-pump-hot-water-installation-guide-electricians-2026/"
  to = "/blog/heat-pump-hot-water-installation-electricians-australia/"
  status = 301
  force = true

# "Installer's Guide" (year-qualified) -> canonical "Complete Guide Australia"
[[redirects]]
  from = "/blog/replacing-gas-hot-water-electric-heat-pump-australia-2026"
  to = "/blog/replacing-gas-hot-water-electric-heat-pump/"
  status = 301
  force = true

[[redirects]]
  from = "/blog/replacing-gas-hot-water-electric-heat-pump-australia-2026/"
  to = "/blog/replacing-gas-hot-water-electric-heat-pump/"
  status = 301
  force = true

